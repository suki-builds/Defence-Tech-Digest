name: Daily Defence Tech Digest

on:
  # Scheduled runs disabled — run manually from the Actions tab instead.
  # To re-enable the daily run, uncomment the two lines below.
  # schedule:
  #   - cron: '0 7 * * *'  # 7:00 AM UTC every day
  workflow_dispatch:       # allows manual trigger from GitHub UI
    inputs:
      dry_run:
        description: 'Dry run: write drafts to a downloadable artifact only (no Prismic, no email, no history)'
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  draft-news:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest -q

      # History of drafted events, so tomorrow's run skips what was already
      # drafted. Kept in the Actions cache rather than a branch so it is not public.
      - name: Restore history
        uses: actions/cache/restore@v4
        with:
          path: state
          key: history-${{ github.run_id }}
          restore-keys: history-

      - name: Run digest
        env:
          DRY_RUN:             ${{ inputs.dry_run }}
          ANTHROPIC_API_KEY:   ${{ secrets.ANTHROPIC_API_KEY }}
          GMAIL_ADDRESS:       ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD:  ${{ secrets.GMAIL_APP_PASSWORD }}
          RECIPIENT_EMAIL:     ${{ secrets.RECIPIENT_EMAIL }}
          PRISMIC_WRITE_TOKEN: ${{ secrets.PRISMIC_WRITE_TOKEN }}
        run: python digest.py

      - name: Upload dry-run output
        if: ${{ inputs.dry_run }}
        uses: actions/upload-artifact@v4
        with:
          name: drafts
          path: out/

      - name: Save history
        if: ${{ !inputs.dry_run }}
        uses: actions/cache/save@v4
        with:
          path: state
          key: history-${{ github.run_id }}
